# PostgreSQL Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/incentivos_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jackson.parameter-names-module.mode=OVERRIDE

# JPA/Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# DevTools Configuration
spring.devtools.restart.enabled=true

springdoc.api-docs.version=openapi_3_0

# Server Configuration for Dockerfile
server.port=${PORT:8080}

#Apis Externas
url.donadores = ${URL_DONADORES:https://donadores-y-entidades-0uv4.onrender.com}
url.donaciones=${URL_DONACIONES:https://marco-maggio-springboot-api-entrega2-dsi.onrender.com}

spring.cloud.compatibility-verifier.enabled=false

management.datadog.metrics.export.api-key=${DATADOG_API_KEY :46ab31032f2f467a70b88701399cc149}
management.datadog.metrics.export.uri=https://api.us5.datadoghq.com
management.datadog.metrics.export.step=10s
management.datadog.metrics.export.enabled=true
management.metrics.tags.application=incentivos